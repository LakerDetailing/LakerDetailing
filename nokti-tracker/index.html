<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15101a">
<title>Nokti — Evidencija zarade</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%85%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#15101a; --bg2:#1c1521; --card:#241b2c; --card2:#2c2235;
  --border:rgba(255,255,255,.07); --text:#f4eef2; --dim:#a999a8;
  --rose:#e3a8a0; --gold:#d9b06d; --green:#7fcf9a; --red:#e2837e;
  --radius:18px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Poppins',sans-serif;
  min-height:100vh;
}
h1,h2,h3{font-family:'Playfair Display',serif; margin:0;}
.hidden{display:none !important;}
input,textarea,select,button{font-family:inherit; color:inherit;}
input,textarea{
  width:100%; background:var(--bg2); border:1px solid var(--border);
  border-radius:12px; padding:12px 14px; font-size:15px; margin-top:6px; margin-bottom:14px;
  outline:none;
}
input:focus,textarea:focus{border-color:var(--rose);}
label{font-size:13px; color:var(--dim); font-weight:500;}
.hint{font-size:13px; color:var(--dim); margin:4px 0 12px;}
.error-text{color:var(--red); font-size:14px; text-align:center;}
.success-text{color:var(--green); font-size:14px; margin-top:8px;}

/* Login */
#login-screen{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
}
.login-card{
  width:100%; max-width:360px; background:var(--card); border:1px solid var(--border);
  border-radius:24px; padding:36px 28px; text-align:center;
}
.brand{margin-bottom:28px;}
.brand .emoji{font-size:42px;}
.brand h1{font-size:30px; margin:8px 0 4px; color:var(--rose);}
.brand p{color:var(--dim); font-size:14px; margin:0;}
.login-card form{text-align:left;}

/* Buttons */
.btn-primary,.btn-secondary,.btn-danger{
  width:100%; border:none; border-radius:12px; padding:13px; font-size:15px;
  font-weight:600; cursor:pointer; transition:opacity .15s;
}
.btn-primary{background:linear-gradient(135deg,var(--rose),var(--gold)); color:#1a1219;}
.btn-secondary{background:var(--bg2); color:var(--text); border:1px solid var(--border);}
.btn-danger{background:rgba(226,131,126,.15); color:var(--red); border:1px solid rgba(226,131,126,.3);}
.btn-primary:disabled{opacity:.6; cursor:default;}
.btn-primary:active,.btn-secondary:active,.btn-danger:active{opacity:.8;}

/* App shell */
#app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative;}
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 20px 10px;
}
.topbar h1{font-size:22px; color:var(--rose);}
.icon-btn{
  background:var(--card); border:1px solid var(--border); border-radius:50%;
  width:38px; height:38px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:16px; color:var(--text);
}
.content{flex:1; padding:8px 20px 110px; overflow-y:auto;}
.tab-panel h2{font-size:20px; margin-bottom:14px;}

/* Cards */
.card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px; margin-bottom:14px;
}
.card h3{font-size:15px; color:var(--dim); margin-bottom:10px; font-family:'Poppins',sans-serif; font-weight:600;}
.cards-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px;}
.stat-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px;}
.stat-card .label{font-size:12px; color:var(--dim); margin-bottom:6px;}
.stat-card .value{font-size:19px; font-weight:700;}
.stat-card .sub{font-size:12px; color:var(--dim); margin-top:2px;}
.stat-income .value{color:var(--green);}
.stat-expense .value{color:var(--red);}
.stat-net.positive .value{color:var(--green);}
.stat-net.negative .value{color:var(--red);}

/* Progress */
.progress-track{background:var(--bg2); border-radius:20px; height:14px; overflow:hidden; margin:10px 0 8px;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--gold),var(--rose)); border-radius:20px; transition:width .4s;}
.progress-label{font-size:13px; color:var(--dim);}

/* Entry list */
.entry-list{display:flex; flex-direction:column; gap:2px;}
.entry-row{
  display:flex; justify-content:space-between; align-items:center;
  padding:12px 4px; border-bottom:1px solid var(--border); cursor:pointer;
}
.entry-row:last-child{border-bottom:none;}
.entry-main{display:flex; flex-direction:column; gap:2px; min-width:0;}
.entry-title{font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:180px;}
.entry-sub{font-size:12.5px; color:var(--dim);}
.entry-side{display:flex; flex-direction:column; align-items:flex-end; gap:2px;}
.amt-income{color:var(--green); font-weight:700; font-size:14.5px;}
.amt-expense{color:var(--red); font-weight:700; font-size:14.5px;}
.entry-date{font-size:11.5px; color:var(--dim);}
.empty-state{text-align:center; color:var(--dim); padding:30px 10px; font-size:14px;}

/* Filters */
.filters{display:flex; flex-direction:column; gap:10px; margin-bottom:14px;}
.seg{display:flex; background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:4px; gap:4px;}
.seg button{
  flex:1; border:none; background:transparent; color:var(--dim); padding:9px 0;
  border-radius:9px; font-size:13.5px; font-weight:600; cursor:pointer;
}
.seg button.active{background:linear-gradient(135deg,var(--rose),var(--gold)); color:#1a1219;}

/* FAB & nav */
.fab{
  position:fixed; right:24px; bottom:88px; width:56px; height:56px; border-radius:50%;
  background:linear-gradient(135deg,var(--rose),var(--gold)); color:#1a1219; font-size:28px;
  border:none; box-shadow:0 8px 20px rgba(0,0,0,.4); cursor:pointer; z-index:30;
  display:flex; align-items:center; justify-content:center;
}
.bottom-nav{
  position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto;
  background:rgba(28,21,33,.92); backdrop-filter:blur(10px); border-top:1px solid var(--border);
  display:flex; z-index:20; padding-bottom:env(safe-area-inset-bottom);
}
.nav-btn{
  flex:1; background:none; border:none; color:var(--dim); padding:10px 0 8px;
  display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; cursor:pointer;
}
.nav-btn span{font-size:11px;}
.nav-btn.active{color:var(--rose);}

/* Modal */
.modal-overlay{
  position:fixed; inset:0; background:rgba(10,7,12,.65); backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
}
.modal{
  width:100%; max-width:420px; max-height:88vh; overflow-y:auto;
  background:var(--card2); border:1px solid var(--border); border-radius:22px; padding:22px;
}
.modal-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
.modal-header h2{font-size:19px;}
.row{display:flex; gap:12px;}
.row .grow{flex:1;}
.row > div:not(.grow){width:120px;}
.modal-actions{display:flex; gap:10px; margin-top:6px;}
.modal-actions .btn-primary{flex:2;}
.modal-actions .btn-danger{flex:1;}

/* Toast */
.toast{
  position:fixed; bottom:170px; left:50%; transform:translateX(-50%);
  background:var(--card2); border:1px solid var(--border); padding:11px 20px;
  border-radius:30px; font-size:14px; z-index:80; box-shadow:0 6px 18px rgba(0,0,0,.4);
  transition:opacity .25s, transform .25s; opacity:0;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
.toast.error{border-color:rgba(226,131,126,.4); color:var(--red);}

@media (min-width:540px){
  body{background:linear-gradient(180deg,var(--bg),#0e0a12);}
}
</style>
</head>
<body>

<div id="login-screen" class="screen">
  <div class="login-card">
    <div class="brand">
      <div class="emoji">💅</div>
      <h1>Nokti</h1>
      <p>Evidencija zarade &amp; troškova</p>
    </div>
    <form id="login-form">
      <label>Email</label>
      <input type="email" id="login-email" required autocomplete="username" placeholder="email@example.com">
      <label>Lozinka</label>
      <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••">
      <button type="submit" id="login-btn" class="btn-primary">Prijavi se</button>
      <p id="login-error" class="error-text hidden" style="margin-top:14px;"></p>
    </form>
  </div>
</div>

<div id="app" class="screen hidden">
  <header class="topbar">
    <h1>💅 Nokti</h1>
    <button id="logout-btn" class="icon-btn" title="Odjava">⏻</button>
  </header>

  <main class="content">
    <section id="tab-dashboard" class="tab-panel">
      <h2>Pregled</h2>
      <div class="cards-grid" id="dash-cards"></div>
      <div class="card" id="dash-investment"></div>
      <div class="card">
        <h3>Poslednji unosi</h3>
        <div id="dash-recent" class="entry-list"></div>
      </div>
    </section>

    <section id="tab-history" class="tab-panel hidden">
      <h2>Svi unosi</h2>
      <div class="filters">
        <div class="seg" id="hist-type-filter">
          <button data-val="all" class="active">Sve</button>
          <button data-val="income">Zarada</button>
          <button data-val="expense">Troškovi</button>
        </div>
        <input type="month" id="hist-month-filter">
        <input type="search" id="hist-search" placeholder="Pretraga po klijentu...">
      </div>
      <div class="card">
        <div id="hist-list" class="entry-list"></div>
      </div>
    </section>

    <section id="tab-stats" class="tab-panel hidden">
      <h2>Statistika</h2>
      <div class="card"><canvas id="stats-chart" height="220"></canvas></div>
      <div class="cards-grid" id="stats-cards"></div>
    </section>

    <section id="tab-settings" class="tab-panel hidden">
      <h2>Podešavanja</h2>
      <div class="card">
        <h3>Kurs razmene</h3>
        <p class="hint">Koristi se za prikaz ukupnih iznosa u obe valute.</p>
        <div class="row" style="align-items:center;">
          <span style="white-space:nowrap;">1 € =</span>
          <input type="number" id="set-rate" step="0.01" min="1" style="margin:0 10px;">
          <span style="white-space:nowrap;">RSD</span>
        </div>
        <button id="set-rate-save" class="btn-primary" style="margin-top:8px;">Sačuvaj kurs</button>
      </div>
      <div class="card" id="set-investment"></div>
      <button id="logout-btn-2" class="btn-secondary">Odjava</button>
    </section>
  </main>

  <button id="fab-add" class="fab" title="Novi unos">+</button>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="dashboard">📊<span>Pregled</span></button>
    <button class="nav-btn" data-tab="history">📜<span>Unosi</span></button>
    <button class="nav-btn" data-tab="stats">📈<span>Statistika</span></button>
    <button class="nav-btn" data-tab="settings">⚙️<span>Podešavanja</span></button>
  </nav>
</div>

<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Novi unos</h2>
      <button type="button" id="modal-close" class="icon-btn">✕</button>
    </div>
    <form id="entry-form">
      <div class="seg" id="form-type">
        <button type="button" data-val="income" class="active">💰 Zarada</button>
        <button type="button" data-val="expense">💸 Trošak</button>
      </div>
      <br>
      <label>Datum</label>
      <input type="date" id="f-date" required>

      <div class="row">
        <div class="grow">
          <label>Iznos</label>
          <input type="number" id="f-amount" step="0.01" min="0.01" required placeholder="0.00">
        </div>
        <div>
          <label>Valuta</label>
          <div class="seg" id="form-currency">
            <button type="button" data-val="RSD" class="active">RSD</button>
            <button type="button" data-val="EUR">EUR</button>
          </div>
        </div>
      </div>

      <div id="field-income">
        <label>Klijent (opciono)</label>
        <input type="text" id="f-client" list="client-list" placeholder="Ime mušterije">
        <datalist id="client-list"></datalist>

        <label>Usluga</label>
        <input type="text" id="f-service" list="service-list" placeholder="npr. Gel lak">
        <datalist id="service-list">
          <option value="Manikir klasičan">
          <option value="Gel lak">
          <option value="Akril nadogradnja">
          <option value="Gel nadogradnja">
          <option value="Pedikir">
          <option value="Nail art">
          <option value="Skidanje">
        </datalist>
      </div>

      <div id="field-expense" class="hidden">
        <label>Kategorija</label>
        <input type="text" id="f-category" list="category-list" placeholder="npr. Materijal">
        <datalist id="category-list">
          <option value="Materijal">
          <option value="Alat / Oprema">
          <option value="Edukacija / Kurs">
          <option value="Marketing">
          <option value="Zakup prostora">
          <option value="Početna investicija">
        </datalist>
      </div>

      <label>Napomena (opciono)</label>
      <textarea id="f-note" rows="2" placeholder="Dodatne napomene..."></textarea>

      <div class="modal-actions">
        <button type="button" id="f-delete" class="btn-danger hidden">Obriši</button>
        <button type="submit" id="f-submit" class="btn-primary">Sačuvaj</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL = 'https://xndoyqefpbnttszxznva.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhuZG95cWVmcGJudHRzenh6bnZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzQ2MzEsImV4cCI6MjA5NzYxMDYzMX0.smtlnfDIVRgnkZYE4xPonIHV1chhw0dPLF-orFhCX6Q';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let entries = [];
let settings = { eur_rate: 117.5 };
let activeTab = 'dashboard';
let editingId = null;
let formType = 'income';
let formCurrency = 'RSD';
let chartInstance = null;

function escapeHtml(str){
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatRSD(n){ return Math.round(n).toLocaleString('sr-RS') + ' RSD'; }
function formatEUR(n){ return n.toLocaleString('sr-RS', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €'; }
function toRSD(amount, currency){ return currency === 'EUR' ? amount * settings.eur_rate : amount; }
function formatDate(d){
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('sr-RS', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function showToast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type === 'error' ? ' error' : '');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}
function showScreen(name){
  document.getElementById('login-screen').classList.toggle('hidden', name !== 'login');
  document.getElementById('app').classList.toggle('hidden', name !== 'app');
}

/* ---------- AUTH ---------- */
async function boot(){
  const { data } = await sb.auth.getSession();
  if (data.session){
    currentUser = data.session.user;
    await afterLogin();
  } else {
    showScreen('login');
  }
}
async function afterLogin(){
  showScreen('app');
  await loadSettings();
  await loadEntries();
}
async function handleLogin(ev){
  ev.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('login-error');
  errEl.classList.add('hidden');
  btn.disabled = true; btn.textContent = 'Prijavljivanje...';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Prijavi se';
  if (error){
    errEl.textContent = 'Pogrešan email ili lozinka.';
    errEl.classList.remove('hidden');
    return;
  }
  currentUser = data.user;
  await afterLogin();
}
async function handleLogout(){
  await sb.auth.signOut();
  currentUser = null; entries = [];
  showScreen('login');
}

/* ---------- DATA ---------- */
async function loadSettings(){
  const { data, error } = await sb.from('nail_settings').select('*').maybeSingle();
  if (error){ console.error(error); return; }
  if (!data){
    const { data: inserted, error: insErr } = await sb.from('nail_settings')
      .insert({ user_id: currentUser.id, eur_rate: 117.5 }).select().single();
    if (!insErr) settings = inserted;
  } else {
    settings = data;
  }
}
async function loadEntries(){
  const { data, error } = await sb.from('nail_entries').select('*')
    .order('entry_date', { ascending: false }).order('created_at', { ascending: false });
  if (error){ showToast('Greška pri učitavanju: ' + error.message, 'error'); return; }
  entries = data || [];
  renderAll();
}

/* ---------- TOTALS ---------- */
function computeTotals(){
  let incomeRSD = 0, expenseRSD = 0, investmentRSD = 0;
  for (const e of entries){
    const rsd = toRSD(Number(e.amount), e.currency);
    if (e.type === 'income') incomeRSD += rsd;
    else {
      expenseRSD += rsd;
      if (e.is_initial_investment) investmentRSD += rsd;
    }
  }
  const netRSD = incomeRSD - expenseRSD;
  const recoveredPct = investmentRSD > 0 ? Math.min(100, (incomeRSD / investmentRSD) * 100) : 100;
  return { incomeRSD, expenseRSD, netRSD, investmentRSD, recoveredPct };
}

/* ---------- RENDER ---------- */
function renderAll(){
  renderDashboard();
  renderHistory();
  if (activeTab === 'stats') renderStats();
  renderSettingsTab();
}

function renderDashboard(){
  const t = computeTotals();
  document.getElementById('dash-cards').innerHTML = `
    <div class="stat-card stat-income">
      <div class="label">Ukupna zarada</div>
      <div class="value">${formatRSD(t.incomeRSD)}</div>
      <div class="sub">≈ ${formatEUR(t.incomeRSD / settings.eur_rate)}</div>
    </div>
    <div class="stat-card stat-expense">
      <div class="label">Ukupni troškovi</div>
      <div class="value">${formatRSD(t.expenseRSD)}</div>
      <div class="sub">≈ ${formatEUR(t.expenseRSD / settings.eur_rate)}</div>
    </div>
    <div class="stat-card stat-net ${t.netRSD >= 0 ? 'positive' : 'negative'}" style="grid-column:1 / -1;">
      <div class="label">Neto profit</div>
      <div class="value">${t.netRSD >= 0 ? '+' : ''}${formatRSD(t.netRSD)}</div>
      <div class="sub">≈ ${formatEUR(t.netRSD / settings.eur_rate)}</div>
    </div>
  `;

  const remaining = Math.max(0, t.investmentRSD - t.incomeRSD);
  const paidOff = t.investmentRSD > 0 && t.incomeRSD >= t.investmentRSD;
  document.getElementById('dash-investment').innerHTML = `
    <h3>Isplativost investicije</h3>
    <div class="progress-track"><div class="progress-fill" style="width:${t.recoveredPct}%"></div></div>
    <div class="progress-label">${formatRSD(Math.min(t.incomeRSD, t.investmentRSD))} / ${formatRSD(t.investmentRSD)} (${t.recoveredPct.toFixed(0)}%)</div>
    ${paidOff
      ? `<p class="success-text">🎉 Investicija je isplaćena! Sve dalje je čista zarada.</p>`
      : `<p class="hint" style="margin-top:8px;">Još ${formatRSD(remaining)} do pune isplate investicije.</p>`}
  `;

  const recent = entries.slice(0, 5);
  document.getElementById('dash-recent').innerHTML = recent.length
    ? recent.map(entryRow).join('')
    : `<div class="empty-state">Nemaš još unosa. Dodaj prvi! 💅</div>`;
  attachRowHandlers('dash-recent');
}

function entryRow(e){
  const sign = e.type === 'income' ? '+' : '−';
  const cls = e.type === 'income' ? 'amt-income' : 'amt-expense';
  const title = e.type === 'income'
    ? escapeHtml(e.client_name || 'Zarada')
    : escapeHtml(e.category || 'Trošak');
  const subtitle = e.type === 'income' ? escapeHtml(e.service || '') : escapeHtml(e.note || '');
  const amountStr = e.currency === 'EUR' ? formatEUR(Number(e.amount)) : formatRSD(Number(e.amount));
  return `<div class="entry-row" data-id="${e.id}">
    <div class="entry-main">
      <span class="entry-title">${title}</span>
      <span class="entry-sub">${subtitle}</span>
    </div>
    <div class="entry-side">
      <span class="${cls}">${sign}${amountStr}</span>
      <span class="entry-date">${formatDate(e.entry_date)}</span>
    </div>
  </div>`;
}

function attachRowHandlers(containerId){
  document.getElementById(containerId).querySelectorAll('.entry-row').forEach(row => {
    row.addEventListener('click', () => {
      const entry = entries.find(x => x.id === row.dataset.id);
      if (entry) openModal(entry);
    });
  });
}

function renderHistory(){
  const typeFilter = document.querySelector('#hist-type-filter button.active')?.dataset.val || 'all';
  const monthFilter = document.getElementById('hist-month-filter').value;
  const search = document.getElementById('hist-search').value.trim().toLowerCase();

  let filtered = entries.filter(e => {
    if (typeFilter !== 'all' && e.type !== typeFilter) return false;
    if (monthFilter && e.entry_date.slice(0,7) !== monthFilter) return false;
    if (search && !(e.client_name || '').toLowerCase().includes(search)) return false;
    return true;
  });

  document.getElementById('hist-list').innerHTML = filtered.length
    ? filtered.map(entryRow).join('')
    : `<div class="empty-state">Nema unosa za izabrani filter.</div>`;
  attachRowHandlers('hist-list');
}

function renderStats(){
  const months = [];
  const now = new Date();
  for (let i = 5; i >= 0; i--){
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push(d.toISOString().slice(0,7));
  }
  const incomeByMonth = months.map(m =>
    entries.filter(e => e.type === 'income' && e.entry_date.slice(0,7) === m)
      .reduce((s,e) => s + toRSD(Number(e.amount), e.currency), 0)
  );
  const expenseByMonth = months.map(m =>
    entries.filter(e => e.type === 'expense' && e.entry_date.slice(0,7) === m)
      .reduce((s,e) => s + toRSD(Number(e.amount), e.currency), 0)
  );
  const labels = months.map(m => {
    const [y, mo] = m.split('-');
    return new Date(y, mo - 1, 1).toLocaleDateString('sr-RS', {month:'short'});
  });

  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(document.getElementById('stats-chart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Zarada', data: incomeByMonth, backgroundColor: '#7fcf9a', borderRadius: 6 },
        { label: 'Troškovi', data: expenseByMonth, backgroundColor: '#e2837e', borderRadius: 6 }
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: '#f4eef2' } } },
      scales: {
        x: { ticks: { color: '#a999a8' }, grid: { color: 'rgba(255,255,255,.05)' } },
        y: { ticks: { color: '#a999a8' }, grid: { color: 'rgba(255,255,255,.05)' } }
      }
    }
  });

  const incomeEntries = entries.filter(e => e.type === 'income');
  const clients = new Set(incomeEntries.map(e => e.client_name).filter(Boolean));
  const avgIncome = incomeEntries.length
    ? incomeEntries.reduce((s,e) => s + toRSD(Number(e.amount), e.currency), 0) / incomeEntries.length
    : 0;
  let bestMonthLabel = '—', bestMonthVal = 0;
  incomeByMonth.forEach((v, i) => { if (v > bestMonthVal){ bestMonthVal = v; bestMonthLabel = labels[i]; } });

  document.getElementById('stats-cards').innerHTML = `
    <div class="stat-card"><div class="label">Broj klijenata</div><div class="value">${clients.size}</div></div>
    <div class="stat-card"><div class="label">Broj usluga</div><div class="value">${incomeEntries.length}</div></div>
    <div class="stat-card"><div class="label">Prosečna zarada</div><div class="value">${formatRSD(avgIncome)}</div></div>
    <div class="stat-card"><div class="label">Najbolji mesec</div><div class="value">${bestMonthLabel}</div><div class="sub">${formatRSD(bestMonthVal)}</div></div>
  `;
}

function renderSettingsTab(){
  document.getElementById('set-rate').value = settings.eur_rate;
  const t = computeTotals();
  document.getElementById('set-investment').innerHTML = `
    <h3>Početna investicija</h3>
    <div class="value" style="font-size:19px; font-weight:700;">${formatRSD(t.investmentRSD)}</div>
    <p class="hint">Ukupno označeno kao "Početna investicija" u unosima. Dodaješ novu kroz "+ Novi unos → Trošak → Kategorija: Početna investicija".</p>
  `;
}

/* ---------- MODAL ---------- */
function openModal(entry){
  editingId = entry ? entry.id : null;
  document.getElementById('modal-title').textContent = entry ? 'Izmeni unos' : 'Novi unos';
  document.getElementById('f-delete').classList.toggle('hidden', !entry);

  formType = entry ? entry.type : 'income';
  formCurrency = entry ? entry.currency : 'RSD';
  setSeg('form-type', formType);
  setSeg('form-currency', formCurrency);
  toggleTypeFields();

  document.getElementById('f-date').value = entry ? entry.entry_date : new Date().toISOString().slice(0,10);
  document.getElementById('f-amount').value = entry ? entry.amount : '';
  document.getElementById('f-client').value = entry ? (entry.client_name || '') : '';
  document.getElementById('f-service').value = entry ? (entry.service || '') : '';
  document.getElementById('f-category').value = entry ? (entry.category || '') : '';
  document.getElementById('f-note').value = entry ? (entry.note || '') : '';

  const clientNames = [...new Set(entries.map(e => e.client_name).filter(Boolean))];
  document.getElementById('client-list').innerHTML = clientNames.map(c => `<option value="${escapeHtml(c)}">`).join('');

  document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal(){
  document.getElementById('modal-overlay').classList.add('hidden');
  document.getElementById('entry-form').reset();
  editingId = null;
}
function setSeg(containerId, val){
  document.querySelectorAll('#' + containerId + ' button').forEach(b => {
    b.classList.toggle('active', b.dataset.val === val);
  });
}
function toggleTypeFields(){
  document.getElementById('field-income').classList.toggle('hidden', formType !== 'income');
  document.getElementById('field-expense').classList.toggle('hidden', formType !== 'expense');
}

async function saveEntry(ev){
  ev.preventDefault();
  const date = document.getElementById('f-date').value;
  const amount = parseFloat(document.getElementById('f-amount').value);
  const note = document.getElementById('f-note').value.trim() || null;

  const payload = {
    type: formType, currency: formCurrency, entry_date: date, amount, note,
    user_id: currentUser.id
  };
  if (formType === 'income'){
    payload.client_name = document.getElementById('f-client').value.trim() || null;
    payload.service = document.getElementById('f-service').value.trim() || null;
    payload.category = null;
    payload.is_initial_investment = false;
  } else {
    const cat = document.getElementById('f-category').value.trim();
    payload.category = cat || null;
    payload.client_name = null;
    payload.service = null;
    payload.is_initial_investment = /investici/i.test(cat);
  }

  const submitBtn = document.getElementById('f-submit');
  submitBtn.disabled = true; submitBtn.textContent = 'Čuvanje...';
  try {
    if (editingId){
      const { error } = await sb.from('nail_entries').update(payload).eq('id', editingId);
      if (error) throw error;
      showToast('Unos izmenjen ✓');
    } else {
      const { error } = await sb.from('nail_entries').insert(payload);
      if (error) throw error;
      showToast('Unos sačuvan ✓');
    }
    closeModal();
    await loadEntries();
  } catch (err){
    showToast('Greška: ' + err.message, 'error');
  } finally {
    submitBtn.disabled = false; submitBtn.textContent = 'Sačuvaj';
  }
}
async function deleteEntry(){
  if (!editingId) return;
  if (!confirm('Obrisati ovaj unos?')) return;
  try {
    const { error } = await sb.from('nail_entries').delete().eq('id', editingId);
    if (error) throw error;
    showToast('Unos obrisan ✓');
    closeModal();
    await loadEntries();
  } catch (err){
    showToast('Greška: ' + err.message, 'error');
  }
}

/* ---------- TABS ---------- */
function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('hidden', p.id !== 'tab-' + tab));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if (tab === 'stats') renderStats();
}

/* ---------- EVENTS ---------- */
document.getElementById('login-form').addEventListener('submit', handleLogin);
document.getElementById('logout-btn').addEventListener('click', handleLogout);
document.getElementById('logout-btn-2').addEventListener('click', handleLogout);
document.getElementById('fab-add').addEventListener('click', () => openModal(null));
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', (e) => { if (e.target.id === 'modal-overlay') closeModal(); });
document.getElementById('entry-form').addEventListener('submit', saveEntry);
document.getElementById('f-delete').addEventListener('click', deleteEntry);

document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));

document.querySelectorAll('#form-type button').forEach(b => b.addEventListener('click', () => {
  formType = b.dataset.val; setSeg('form-type', formType); toggleTypeFields();
}));
document.querySelectorAll('#form-currency button').forEach(b => b.addEventListener('click', () => {
  formCurrency = b.dataset.val; setSeg('form-currency', formCurrency);
}));
document.querySelectorAll('#hist-type-filter button').forEach(b => b.addEventListener('click', () => {
  setSeg('hist-type-filter', b.dataset.val); renderHistory();
}));
document.getElementById('hist-month-filter').addEventListener('change', renderHistory);
document.getElementById('hist-search').addEventListener('input', renderHistory);

document.getElementById('set-rate-save').addEventListener('click', async () => {
  const rate = parseFloat(document.getElementById('set-rate').value);
  if (!rate || rate <= 0) return showToast('Unesi ispravan kurs.', 'error');
  try {
    const { error } = await sb.from('nail_settings').update({ eur_rate: rate, updated_at: new Date().toISOString() }).eq('user_id', currentUser.id);
    if (error) throw error;
    settings.eur_rate = rate;
    showToast('Kurs sačuvan ✓');
    renderAll();
  } catch (err){
    showToast('Greška: ' + err.message, 'error');
  }
});

boot();
</script>
</body>
</html>
